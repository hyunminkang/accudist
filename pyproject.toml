[build-system]
requires = ["meson-python>=0.15", "numpy>=2.0", "tomli>=2; python_version < '3.11'"]
build-backend = "mesonpy"

[project]
name = "accudist"
version = "0.1.0"
description = "Probability distributions with R-grade numerical precision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]
authors = [{ name = "Hyun Min Kang" }]
keywords = ["probability", "statistics", "numpy", "rmath", "distributions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE", "vendor/nmath/COPYING"]

[project.urls]
Documentation = "https://hyunminkang.github.io/accudist/"
Repository = "https://github.com/hyunminkang/accudist"
Issues = "https://github.com/hyunminkang/accudist/issues"
Changelog = "https://github.com/hyunminkang/accudist/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3", "scipy>=1.11", "mypy>=1.10", "pyyaml>=6", "tomli>=2; python_version < '3.11'"]
docs = ["mkdocs-material>=9,<10"]

[tool.meson-python.args]
# Force MSVC activation on Windows even when GCC/LLVM is already on PATH. Meson
# documents --vsenv as a no-op on other platforms.
setup = ["--vsenv"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
enable = ["cpython-freethreading"]
skip = "pp* *-musllinux_*"
test-requires = ["pytest", "hypothesis", "mpmath", "scipy", "pyyaml", "tomli; python_version < '3.11'"]
test-command = "pytest -q {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[[tool.cibuildwheel.overrides]]
select = "cp3??t-*"
test-requires = ["pytest"]
test-command = "pytest -q {project}/tests/test_free_threading.py {project}/tests/test_thread_safety.py"

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["scipy_gap: numerical cases where scipy loses tail precision"]
testpaths = ["tests"]
