[build-system]
requires = ["setuptools>=77", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accudist"
version = "0.1.0"
description = "Probability distributions with R-grade numerical precision (R's nmath as NumPy ufuncs)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "NOTICE", "vendor/nmath/COPYING"]
authors = [{ name = "Hyun Min Kang" }]
keywords = ["probability", "statistics", "distributions", "numpy", "rmath", "R", "log-scale", "tail probability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.25"]

[project.urls]
Homepage = "https://github.com/hyunminkang/accudist"
Documentation = "https://hyunminkang.github.io/accudist/"
Repository = "https://github.com/hyunminkang/accudist"
Issues = "https://github.com/hyunminkang/accudist/issues"
Changelog = "https://github.com/hyunminkang/accudist/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "scipy>=1.11"]
docs = ["mkdocs-material>=9,<10"]

[tool.setuptools]
packages = ["accudist", "accudist.compat"]
include-package-data = false

[tool.setuptools.package-data]
accudist = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "scipy_gap: motivating cases where scipy loses tail precision",
    "slow: large wilcox/signrank grids and thread stress tests",
]
filterwarnings = ["error::accudist.AccudistWarning"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *-musllinux_* *_i686 *-win32"
build-verbosity = 1
test-requires = ["pytest", "hypothesis"]
# double quotes: single quotes are not quoting characters for cmd.exe on Windows
test-command = 'pytest -q -m "not slow" {project}/tests'

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
