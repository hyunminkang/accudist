[build-system]
requires = ["meson-python>=0.15", "numpy>=2.0"]
build-backend = "mesonpy"

[project]
name = "accudist"
version = "0.1.0"
description = "Probability distributions with R-grade numerical precision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "vendor/nmath/COPYING"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "mpmath>=1.3", "scipy>=1.11", "mypy>=1.10"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp313t-* cp314-* cp314t-*"
skip = "pp* *-musllinux_*"
test-requires = ["pytest", "hypothesis", "mpmath", "scipy"]
test-command = "pytest -q {project}/tests"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["scipy_gap: numerical cases where scipy loses tail precision"]
testpaths = ["tests"]
