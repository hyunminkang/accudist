name: docs

# Build-only check. The site is published by hand with `mkdocs gh-deploy`
# (pushes to the gh-pages branch); see docs/development.md.
on:
  push:
    branches: [main, claude]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs-material
      - run: python -m mkdocs build --strict
