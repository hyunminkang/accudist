name: reference-vectors
on:
  workflow_dispatch:
jobs:
  reference:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: Rscript tools/gen_reference.R
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/r-4.5.2-reference-vectors
          commit-message: Regenerate R 4.5.2 reference vectors
          title: Regenerate R 4.5.2 reference vectors
          body: Generated by the pinned official R 4.5.2 reference workflow.
