name: reference-vectors
on:
  workflow_dispatch:
jobs:
  generate:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-x86_64}
          - {os: ubuntu-24.04-arm, platform: linux-arm64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x86_64}
          - {os: windows-latest, platform: windows-amd64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: Rscript tools/gen_reference.R
        env:
          ACCUDIST_ORACLE_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ matrix.platform }}
          path: tests/data/${{ matrix.platform }}/*.jsonl
  reference:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: oracle-*
          path: generated-oracles
      - run: python tools/collect_oracles.py generated-oracles tests/data
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/r-4.5.2-reference-vectors
          commit-message: Regenerate R 4.5.2 reference vectors
          title: Regenerate R 4.5.2 reference vectors
          body: Generated by pinned official R 4.5.2 binaries on every supported wheel platform.
