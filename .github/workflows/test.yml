name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.13t', '3.14', '3.14t']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # SciPy source releases can precede free-threaded wheels.  Use the newest
      # compatible wheel instead of trying to build SciPy on the runner.
      - run: python -m pip install --only-binary=scipy '.[test]'
      - run: python -m pytest -q "${{ github.workspace }}/tests"
        working-directory: ${{ runner.temp }}
      - run: python -m mypy accudist
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]'
      - run: python -m mkdocs build --strict
      - run: python tools/check_docs.py site
