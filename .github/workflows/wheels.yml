name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - name: Install the sdist offline (vendored sources are committed; no network at build time)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet setuptools numpy
          /tmp/venv/bin/pip install --no-build-isolation --no-index --no-deps dist/*.tar.gz
          cd /tmp && /tmp/venv/bin/python -c "import accudist; print(accudist.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.2
        env:
          # each runner builds its native architecture (see [tool.cibuildwheel] in pyproject.toml)
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
